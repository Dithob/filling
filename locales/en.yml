contextMenu:
  fill: Fill with FieldBook…
options:
  title: FieldBook Settings
  description: FieldBook keeps your experience ready to go wherever you apply. Manage your data and adapters here.
  cnProfileJson:
    title: Profile.json
    description: Maintain every field in a single JSON file. Import it on any machine to take your settings with you.
    export: Export JSON
    import: Import JSON
    invalid: Failed to read profile.json. Make sure the file is valid JSON.
    noProfile: Create a profile first to enable export.
  sections:
    gettingStarted: Getting started
    profiles: Profiles
    autofill: Autofill
    advanced: Advanced
  toc:
    title: Quick sections
    helper: Jump to any settings section without losing your place.
  gettingStarted:
    helper: Import one resume and you can start filling. Matching and filling run entirely on-device — no network needed.
    tip: 'Tip: Pin FieldBook in your browser toolbar so you can launch autofill faster.'
  checklist:
    profile:
      title: Create or import a profile
      description: Import a profile.json, upload a resume PDF, or type the details in by hand.
    openSection: Open section
  adapters:
    heading: Field adapters
    description: Choose which label adapters FieldBook should use when matching fields. All matching runs locally.
  autofill:
    heading: Auto fill behavior
    description: Decide how FieldBook handles fields that need attention during auto fill.
    skip: Skip issues and continue automatically
    pause: Pause for manual review
  fillMode:
    heading: Fill strategy
    description: Applies to the batch "Fill matched fields" action. Filling a single field by hand always overwrites it.
    emptyOnly: Only fill empty fields
    emptyOnlyHint: Leaves values you already typed on the page untouched.
    overwrite: Overwrite existing values
    overwriteHint: Replaces whatever the page already contains with your profile values.
  overlay:
    heading: Highlight overlay
    description: Choose whether FieldBook dims the page and highlights fields during guidance.
    toggle: Show focused field highlight
    enabled: The highlight overlay will surround fields while prompts are shown.
    disabled: Only the prompt bubble will appear without dimming the rest of the page.
  memory:
    heading: Field memory
    description: Review and clear learned field associations used for suggestions.
    refresh: Refresh
    clearAll: Clear all
    delete: Delete
    empty: No saved field memory yet.
    loading: Loading saved memory…
    error: Unable to load memory ($1)
    preferredSlot: 'Preferred slot: $1'
    lastValue: 'Last value: $1'

  advanced:
    description: Review and manage saved field memory.
  aiParse:
    title: Configure AI parsing (DeepSeek)
    description: 'Only used when importing a resume: the PDF text goes to the model and comes back as a structured profile, which holds up better than rules on unusual layouts.'
    apiKey: API key
    apiKeyPlaceholder: sk-...
    model: Model
    modelHint: Defaults to deepseek-flash. Leave it alone unless you know you need a different one.
    advanced: Advanced
    baseUrl: API base URL
    baseUrlPlaceholder: https://api.deepseek.com
    privacyNote: Resume text is sent straight from your browser to the endpoint you configure. Your API key stays local. Keep this page open while parsing runs.
    save: Save and start parsing
    notConfigured: AI parsing is not configured yet. Add your DeepSeek API key and try again.

  celebration:
    title: 'All set! 🎉'
    message: Your first profile is saved. Time to start autofilling.
    cta: Start autofilling

  profileForm:
    heading: Profile details
    description: Provide structured resume data or import it from a PDF.
