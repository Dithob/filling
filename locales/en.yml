      ruleHint: No AI needed. Built-in rules read your name, contact details, education and more in seconds.
      parseAction: Parse with AI
      parseHint: Uses your configured model — better at unusual layouts and non-standard wording.
      parseSetupHint: No AI parsing configured yet. You'll be asked for a DeepSeek key first, then parsing starts right away.
      storeAction: Store file only
      parseAgain: Re-run AI parsing
      parseAgainConfirmTitle: Overwrite with new AI parsing?
      parseAgainConfirmDescription: Running the parser again will overwrite any fields that receive new values. Existing inputs without new data will be kept.
      parseAgainConfirmConfirm: Parse again
      parseAgainConfirmCancel: Cancel
    preview:
      heading: Resume preview
      helper: Keep the imported PDF handy while filling out the structured form.
